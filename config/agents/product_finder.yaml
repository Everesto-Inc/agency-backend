# Topic 2 (cheapest product finder) parameters. Hot-reloaded.

search:
  max_queries: 4                # planner-proposed queries actually executed
  results_per_query: 6
  max_pages_to_check: 12        # pages fetched + extracted per run (cost bound)
  exclude_domains: [pinterest.com, youtube.com, reddit.com, facebook.com, wikipedia.org,
                    instagram.com, tiktok.com, x.com, twitter.com, quora.com]
  # Retailers searched explicitly per country (in addition to open web search).
  retailer_hints:
    US: [amazon.com, bestbuy.com, walmart.com, target.com, newegg.com, bhphotovideo.com]
    GB: [amazon.co.uk, argos.co.uk, currys.co.uk, johnlewis.com, ebay.co.uk]
    DE: [amazon.de, mediamarkt.de, saturn.de, otto.de, idealo.de, cyberport.de]
    FR: [amazon.fr, fnac.com, darty.com, boulanger.com, cdiscount.com, ldlc.com]
    IN: [amazon.in, flipkart.com, croma.com, reliancedigital.in]
    NP: [daraz.com.np, sastodeal.com, hamrobazaar.com]

fetch:
  concurrency: 6
  timeout_s: 12
  max_bytes: 1500000
  max_text_chars: 12000         # page text sent to the extractor (token bound)

extraction:
  prefer_structured_data: true  # schema.org JSON-LD offers first: exact and free (no LLM)
  verify_price_on_page: true    # LLM-extracted prices must literally appear on the page

fx:
  url: https://api.frankfurter.app/latest   # ECB reference rates, no key
  cache_ttl_s: 21600

ranking:
  allowed_verdicts: [exact, variant]   # drop accessories/mismatches
  top_n: 5
