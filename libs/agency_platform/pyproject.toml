[project]
name = "agency-platform"
version = "0.1.0"
description = "Shared LLMOps platform: auth, plans/quotas, model-gateway client, observability, service scaffolding."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0.2",
    "aiomysql>=0.2",
    "cryptography>=43",  # MySQL 8 caching_sha2_password auth
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agency_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
