global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: agency
    metrics_path: /metrics
    static_configs:
      - targets: [edge-gateway:8000, model-gateway:8000, topic-ev-research:8000,
                  topic-product-finder:8000, topic-finance:8000]
