apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autonomous-agency-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/autonomous-agency.git   # set to your repo
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: autonomous-agency-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
