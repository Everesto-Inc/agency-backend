# Public surface: edge routes + each topic's own API. The model gateway is
# deliberately NOT exposed (cluster-internal only).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agency
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"          # SSE streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"       # long agent runs
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/limit-rps: "20"                 # coarse per-IP flood guard
    nginx.ingress.kubernetes.io/enable-cors: "false"            # CORS handled by the apps
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.com]
      secretName: agency-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - { path: /api/v1/ev_research, pathType: Prefix, backend: { service: { name: topic-ev-research, port: { name: http } } } }
          - { path: /api/v1/product_finder, pathType: Prefix, backend: { service: { name: topic-product-finder, port: { name: http } } } }
          - { path: /api/v1/finance, pathType: Prefix, backend: { service: { name: topic-finance, port: { name: http } } } }
          - { path: /api/v1, pathType: Prefix, backend: { service: { name: edge-gateway, port: { name: http } } } }
