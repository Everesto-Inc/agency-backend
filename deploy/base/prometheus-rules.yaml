# GENERATED by scripts/sync_alert_rules.py from deploy/monitoring/prometheus/alerts.yml -- do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agency-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: agency-llm
    rules:
    - alert: LLMModelErrorRateHigh
      expr: "sum by (model) (rate(agency_llm_calls_total{status=\"error\"}[10m]))\n  / sum by (model) (rate(agency_llm_calls_total[10m]))\
        \ > 0.10\n"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Model {{ $labels.model }} error rate above 10%
        description: Fallbacks are absorbing it, but cost/latency rise. Check provider status / models.yaml.
    - alert: LLMLatencyP95High
      expr: histogram_quantile(0.95, sum by (le, model) (rate(agency_llm_call_seconds_bucket[10m]))) > 30
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: p95 latency for {{ $labels.model }} above 30s
    - alert: LLMCostSpike
      expr: 'sum(increase(agency_llm_cost_usd_total[1h])) > 1

        and sum(increase(agency_llm_cost_usd_total[1h])) > 2 * sum(increase(agency_llm_cost_usd_total[1h] offset 1d))

        '
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: LLM spend in the last hour is more than 2x the same hour yesterday
    - alert: TopicCostSpike
      expr: "sum by (topic) (increase(agency_llm_cost_usd_total[1h])) > 0.5\nand sum by (topic) (increase(agency_llm_cost_usd_total[1h]))\n\
        \  > 3 * sum by (topic) (increase(agency_llm_cost_usd_total[1h] offset 1d))\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Spend for topic {{ $labels.topic }} tripled vs yesterday
  - name: agency-agents
    rules:
    - alert: AgentRunFailureRateHigh
      expr: "sum by (topic) (rate(agency_agent_runs_total{status=~\"error|timeout\"}[15m]))\n  / sum by (topic) (rate(agency_agent_runs_total[15m]))\
        \ > 0.15\n"
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: More than 15% of {{ $labels.topic }} runs fail or time out
    - alert: AgentRunLatencyP95High
      expr: histogram_quantile(0.95, sum by (le, topic) (rate(agency_agent_run_seconds_bucket[15m]))) > 120
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: p95 run latency for {{ $labels.topic }} above 2 minutes
    - alert: QuotaRejectionsSurge
      expr: sum by (topic, code) (rate(agency_quota_rejections_total[15m])) * 60 > 5
      for: 15m
      labels:
        severity: info
      annotations:
        summary: Many {{ $labels.code }} rejections on {{ $labels.topic }} (upsell signal or abuse)
    - alert: ServiceDown
      expr: up{job="agency"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.instance }} is down'
  - name: agency-quality
    rules:
    - alert: OnlineJudgeScoreLow
      expr: agency_quality_judge_score < 3.5
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Online judge score for {{ $labels.topic }} is {{ $value }} (< 3.5)
    - alert: QualityDriftDetected
      expr: max by (topic, metric) (agency_drift_detected) == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'Drift on {{ $labels.topic }}: {{ $labels.metric }}'
    - alert: OfflineEvalPassRateLow
      expr: agency_eval_pass_rate < 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Latest offline eval pass rate for {{ $labels.topic }} below 80%
