[project]
name = "edge-gateway"
version = "0.1.0"
description = "Public edge: identity (register/login/refresh), /chat topic auto-routing, usage + admin APIs."
requires-python = ">=3.13,<3.14"
dependencies = ["agency-platform"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.25"]

[tool.uv.sources]
agency-platform = { path = "../../libs/agency_platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
