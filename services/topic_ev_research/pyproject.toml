[project]
name = "topic-ev-research"
version = "0.1.0"
description = "Topic 1: EV helper (LangGraph). Grounded specs + deterministic TCO math."
requires-python = ">=3.13,<3.14"
dependencies = [
    "agency-platform",
    "langgraph>=1.0",
    "crawl4ai>=0.7",
    "pycountry>=24.6",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.25"]

[tool.uv.sources]
agency-platform = { path = "../../libs/agency_platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ev_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
